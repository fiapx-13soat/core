name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: fiapx-core

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # sobe Postgres/Redis/RabbitMQ via Testcontainers; o runner já tem Docker
      - run: npm run test:int

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Learner Lab: sem OIDC. Credenciais temporárias do lab vêm dos secrets
      # (rotacionam a cada sessão do lab — recolar antes de publicar).
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - run: |
          npm ci
          npm run build
          REG=${{ steps.login-ecr.outputs.registry }}
          docker build -t $REG/$ECR_REPOSITORY:${{ github.sha }} -t $REG/$ECR_REPOSITORY:latest .
          docker push $REG/$ECR_REPOSITORY:${{ github.sha }}
          docker push $REG/$ECR_REPOSITORY:latest

